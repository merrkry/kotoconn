[project]
name = "kotoconn-tooling"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[dependency-groups]
dev = ["ruff>=0.16.7", "pyrefly>=1.3.0"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["external"]

[tool.ruff.lint]
extend-select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "C4",
    "FA",
    "ISC",
    "ICN",
    "RET",
    "SIM",
    "TID",
    "TC",
    "PTH",
    "TD",
    "NPY",
    "FURB",
]

[tool.pyrefly]
preset = "strict"
project-includes = ["**/*.py"]
project-excludes = ["external/**", "target/**", "**/node_modules/**"]
search-path = [".", "e2e", "benchmarks", "tools"]
python-version = "3.14"
