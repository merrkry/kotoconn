[project]
name = "kotoconn-tooling"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.16.7", "pyrefly>=1.3.0"]

[tool.ruff]
target-version = "py314"
include = ["e2e/**/*.py", "benchmarks/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyrefly]
project-includes = ["e2e/**/*.py", "benchmarks/**/*.py", "tools/**/*.py"]
search-path = [".", "e2e", "benchmarks", "tools"]
python-version = "3.14"
