[package]
name = "kotoconn-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
kotoconn-config.workspace = true
kotoconn-inbounds.workspace = true
kotoconn-outbounds.workspace = true
kotoconn-protocol.workspace = true
kotoconn-script.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
rcgen.workspace = true
bytes.workspace = true
fast-socks5.workspace = true
shadowsocks.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
