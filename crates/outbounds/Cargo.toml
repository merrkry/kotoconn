[package]
name = "kotoconn-outbounds"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
kotoconn-config.workspace = true
kotoconn-http.workspace = true
kotoconn-hysteria2.workspace = true
kotoconn-protocol.workspace = true
kotoconn-shadowsocks2022.workspace = true
kotoconn-socks5.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
