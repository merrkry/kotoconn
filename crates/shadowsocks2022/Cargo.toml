[package]
name = "kotoconn-shadowsocks2022"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures-util.workspace = true
kotoconn-config.workspace = true
kotoconn-protocol.workspace = true
rand.workspace = true
shadowsocks = { workspace = true, features = ["aead-cipher-2022"] }
shadowsocks-service = { workspace = true, features = ["aead-cipher-2022"] }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
