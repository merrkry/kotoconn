[package]
name = "kotoconn-script"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
derive_more = { workspace = true, features = ["from", "into"] }
duplicate.workspace = true
kotoconn-config.workspace = true
kotoconn-typescript.workspace = true
rquickjs = { workspace = true, features = ["macro", "loader", "futures"] }
structural-convert.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
ts-rs.workspace = true

[dev-dependencies]
hickory-proto.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
trybuild.workspace = true
