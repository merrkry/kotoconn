[tools]
"github:moonrepo/moon" = "2.6.6"
"github:rust-cross/cargo-zigbuild" = "0.24.1"
go = "1.27.4"
node = "26.13.1"
pnpm = "12.22.0"
rust = { version = "1.100.1", components = "clippy,rustfmt" }
uv = "0.13.10"
zig = "0.16.0"

[env]
UV_PYTHON_PREFERENCE = "only-managed"
# System tasks need the execution platform in their moon cache keys.
KOTOCONN_BUILD_HOST = "{{ os() }}-{{ arch() }}"
