[tools]
"github:moonrepo/moon" = "2.6.4"
"github:rust-cross/cargo-zigbuild" = "0.23.4"
go = "1.27.3"
node = "24.19.0"
pnpm = "11.28.7"
rust = { version = "1.98.1", components = "clippy,rustfmt" }
uv = "0.13.6"
zig = "0.16.0"

[env]
UV_PYTHON_PREFERENCE = "only-managed"
# System tasks need the execution platform in their moon cache keys.
KOTOCONN_BUILD_HOST = "{{ os() }}-{{ arch() }}"
