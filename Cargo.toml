[workspace]
members = ["crates/protocol", "crates/inbounds", "crates/outbounds", "crates/http", "crates/socks5", "crates/shadowsocks2022", "crates/cli", "crates/config", "crates/daemon", "crates/script", "crates/typescript"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
kotoconn-protocol = { path = "crates/protocol" }
kotoconn-inbounds = { path = "crates/inbounds" }
kotoconn-outbounds = { path = "crates/outbounds" }
kotoconn-http = { path = "crates/http" }
kotoconn-socks5 = { path = "crates/socks5" }
kotoconn-shadowsocks2022 = { path = "crates/shadowsocks2022" }
fast-socks5 = "1.0"
http = "1"
httparse = "1.10"
bytes = "1"
rand = "0.9"
shadowsocks-service = { version = "1.25", default-features = false, features = ["aead-cipher-2022"] }
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher-2022"] }

hickory-proto = { version = "0.26", default-features = false }
kotoconn-config = { path = "crates/config" }
kotoconn-script = { path = "crates/script" }
kotoconn-daemon = { path = "crates/daemon" }
kotoconn-typescript = { path = "crates/typescript" }
oxc = { version = "0.149", default-features = false, features = ["codegen", "semantic", "transformer"] }
rquickjs = { version = "0.13", features = ["macro", "loader", "futures"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures-util = "0.3.34"
thiserror = "2.0.20"
ts-rs = "12.0.1"
structural-convert = "0.13"
duplicate = "2.0.1"
derive_more = { version = "2", features = ["from", "into"] }
trybuild = "1.0.121"
