services:
  echo:
    image: kotoconn-tun:local
    entrypoint: [python3]
    command: [-u, /tests/traffic.py, serve]
    volumes:
      - ./traffic.py:/tests/traffic.py:ro
    healthcheck:
      test: [CMD, python, /tests/traffic.py, ready]
      interval: 1s
      timeout: 2s
      retries: 30
  kotoconn:
    image: ${KOTOCONN_IMAGE:?Build the E2E image first}
    volumes:
      - ${CASE_DIR:?}/kotoconn:/config:ro
  gateway:
    image: ${KOTOCONN_IMAGE}
    volumes:
      - ${CASE_DIR}/gateway:/config:ro
    profiles: [nested]
  peer:
    image: ghcr.io/sagernet/sing-box:v1.14.4@sha256:988b3b5369524452a1ff3ae7ee6d9c2afc675d2d820501d18d20b3ba230a11ad
    command: [run, -c, /config/peer.json]
    volumes:
      - ${CASE_DIR}:/config:ro
  entry:
    image: ghcr.io/sagernet/sing-box:v1.14.4@sha256:988b3b5369524452a1ff3ae7ee6d9c2afc675d2d820501d18d20b3ba230a11ad
    command: [run, -c, /config/entry.json]
    volumes:
      - ${CASE_DIR}:/config:ro
# No published ports, host networking, shared volumes or fixed container names.
# Compose allocates a separate network for each project.
