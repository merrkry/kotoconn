language: python
tasks:
  build-app:
    command: uv run --locked python tools/docker.py app --tag kotoconn-e2e:local
    deps: [rust:build-linux-debug]
    options:
      cache: false
      mutex: docker-host-network
  build-runtime:
    command: uv run --locked python tools/docker.py test-runtime --tag kotoconn-tun:local
    options:
      cache: false
      mutex: docker-host-network
  build:
    deps: [build-app, build-runtime, build-anytls]
  build-anytls-peer:
    command: go -C e2e/anytls/reference build -mod readonly -trimpath -o ../../../target/anytls-interop/anytls-go-peer .
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOTOOLCHAIN: local
    inputs: [/e2e/anytls/reference/**/*, /mise.toml, $KOTOCONN_BUILD_HOST]
    outputs: [/target/anytls-interop/anytls-go-peer]
  build-anytls:
    command: uv run --locked python tools/docker.py anytls-interop --tag kotoconn-anytls-interop:local
    deps: [rust:build-anytls-interop, build-anytls-peer]
    options:
      cache: false
      mutex: docker-host-network
  test:
    command: uv run --locked python e2e/run.py
    deps: [build]
    options:
      cache: false
      mutex: docker-host-network
  test-tun:
    command: uv run --locked python e2e/tun.py
    deps: [rust:build-linux-debug, build-runtime]
    options:
      cache: false
  test-isolation:
    command: uv run --locked python e2e/tun_support/check_isolation.py
    deps: [rust:build-linux-debug, build-runtime]
    options:
      cache: false
      mutex: docker-host-network
