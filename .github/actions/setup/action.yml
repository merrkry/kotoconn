name: Set up workspace
description: Install the mise toolchain and locked workspace dependencies.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
      with:
        version: 2026.8.6
    - uses: Swatinem/rust-cache@v2
    # rust-cache probes both directories without awaiting missing-path errors.
    # Remove after https://github.com/Swatinem/rust-cache/pull/387 is released.
    - name: Prepare Cargo test cache directories
      shell: bash
      run: mkdir -p target/tests/target target/tests/trybuild
    - name: Locate dependency caches
      id: paths
      shell: bash
      run: |
        echo "pnpm=$(pnpm store path)" >> "$GITHUB_OUTPUT"
        echo "uv=$(uv cache dir)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.paths.outputs.pnpm }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-
    - uses: actions/cache@v4
      with:
        path: ${{ steps.paths.outputs.uv }}
        key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock', '.python-version') }}
        restore-keys: ${{ runner.os }}-uv-
    - name: Install TypeScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Synchronize Python environment
      shell: bash
      run: pnpm exec nx run workspace:setup
