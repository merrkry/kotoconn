name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      tun_profile:
        description: TUN workload profile
        type: choice
        default: quick
        options: [quick, stress]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: "false"

jobs:
  e2e:
    name: End-to-end tests and benchmark pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build portable binaries with Zig
        run: pnpm exec nx run rust:build
      - uses: docker/setup-buildx-action@v3
      - name: Build images and export TUN binaries
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          set: |
            proxy.cache-from=type=gha,scope=kotoconn-e2e
            proxy.cache-to=type=gha,scope=kotoconn-e2e,mode=max
            binaries.cache-from=type=gha,scope=kotoconn-e2e
            tun-runtime.cache-from=type=gha,scope=kotoconn-tun
            tun-runtime.cache-to=type=gha,scope=kotoconn-tun,mode=max
      # Bake above already fulfilled docker:build, including filesystem exports.
      - name: Run protocol E2E suites
        run: pnpm exec nx run e2e:test --excludeTaskDependencies
      - name: Run Linux TUN E2E suite
        env:
          TUN_PROFILE: ${{ inputs.tun_profile || 'quick' }}
        run: pnpm exec nx run e2e:tun --excludeTaskDependencies -- --profile "$TUN_PROFILE"
      - name: Check concurrent TUN isolation
        run: pnpm exec nx run e2e:isolation --excludeTaskDependencies
      - name: Check benchmark measurement pipeline and UDP warmup reuse
        run: pnpm exec nx run-many -p benchmarks -t smoke,udp-churn-smoke --excludeTaskDependencies --parallel=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            target/e2e
            target/benchmarks
          if-no-files-found: ignore
