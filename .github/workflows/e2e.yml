name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      tun_profile:
        description: TUN workload profile
        type: choice
        default: quick
        options: [quick, stress]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end tests and benchmark smoke checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KOTOCONN_DOCKER_CACHE: .cache/docker
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-scope: e2e
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v5
        with:
          path: .cache/docker
          key: docker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/Dockerfile', '.python-version') }}-${{ github.sha }}
          restore-keys: |
            docker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/Dockerfile', '.python-version') }}-
            docker-${{ runner.os }}-${{ runner.arch }}-
      - name: Run E2E suites and concurrent isolation check
        env:
          TUN_PROFILE: ${{ inputs.tun_profile || 'quick' }}
        run: |
          mise exec -- moon run docker:test docker:test-isolation
          mise exec -- moon run docker:test-tun -- --profile "$TUN_PROFILE"
      - name: Check release benchmark pipeline and UDP warmup reuse
        run: mise exec -- moon run benchmark:test-smoke benchmark:test-udp-churn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            target/e2e
            target/benchmarks
            .moon/cache/runReport.json
          if-no-files-found: ignore
