name: End-to-end tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/Dockerfile
          build-args: CARGO_TERM_COLOR=${{ env.CARGO_TERM_COLOR }}
          tags: kotoconn-e2e:local
          load: true
          cache-from: type=gha,scope=kotoconn-e2e
          cache-to: type=gha,scope=kotoconn-e2e,mode=max
      - name: Run E2E suites
        run: python3 e2e/run.py
      - uses: actions/upload-artifact@v4
        # Upload diagnostic logs even if tests fail or the run is cancelled.
        if: always()
        with:
          name: e2e-results
          path: target/e2e
          if-no-files-found: ignore
