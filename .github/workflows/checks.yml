name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NX_DAEMON: "false"

jobs:
  check:
    name: Rust, TypeScript and Python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check all languages and the smoltcp fork
        run: pnpm exec nx run workspace:verify --parallel=2
